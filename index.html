      // =========================================================================
      // 2. طبقة الأمان، التشفير، وعزل البيانات (IndexedDB + LocalStorage + OwnerId)
      // =========================================================================
      const DB_NAME = 'StudentOS_Standalone_DB';
      const DB_VERSION = 1;

      function openStudentDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('user_states')) {
              db.createObjectStore('user_states', { keyPath: 'ownerId' });
            }
            if (!db.objectStoreNames.contains('files')) {
              const store = db.createObjectStore('files', { keyPath: 'id' });
              store.createIndex('ownerId', 'ownerId', { unique: false });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function saveUserStateToIDB(ownerId, state) {
        if (!ownerId) return;
        const db = await openStudentDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('user_states', 'readwrite');
          tx.objectStore('user_states').put({
            ownerId,
            data: state,
            updatedAt: new Date().toISOString(),
          });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function loadUserStateFromIDB(ownerId) {
        if (!ownerId) return null;
        const db = await openStudentDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('user_states', 'readonly');
          const req = tx.objectStore('user_states').get(ownerId);
          req.onsuccess = () => resolve(req.result ? req.result.data : null);
          req.onerror = () => reject(req.error);
        });
      }

      async function saveBinaryFileIDB(ownerId, fileObj) {
        if (!ownerId) throw new Error('Unauthorized');
        const db = await openStudentDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('files', 'readwrite');
          tx.objectStore('files').put({ ...fileObj, ownerId });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function getScopedFilesIDB(ownerId) {
        if (!ownerId) return [];
        const db = await openStudentDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('files', 'readonly');
          const index = tx.objectStore('files').index('ownerId');
          const req = index.getAll(ownerId);
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }

      async function deleteScopedFileIDB(ownerId, fileId) {
        const db = await openStudentDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('files', 'readwrite');
          const store = tx.objectStore('files');
          const getReq = store.get(fileId);
          getReq.onsuccess = () => {
            const rec = getReq.result;
            if (!rec || rec.ownerId !== ownerId) {
              reject(new Error('Access Denied: Cross-account file deletion blocked'));
              return;
            }
            store.delete(fileId);
          };
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function hashPassword(password, salt) {
        const enc = new TextEncoder();
        const data = enc.encode(`${salt}::${password}::StudentOS_v1`);
        if (window.crypto && window.crypto.subtle) {
          const digest = await window.crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(digest))
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('');
        }
        let h = 0;
        const s = `${salt}:${password}`;
        for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
        return String(h);
      }

      // =========================================================================
      // 4. التطبيق الرئيسي StudentOS
      // =========================================================================

        const notify = (msg) => {

        // حفظ قائمة المستخدمين
        useEffect(() => {
          localStorage.setItem('studentos_users_v1', JSON.stringify(users));
        }, [users]);

        // تحميل بيانات المستخدم المعزولة عند تسجيل الدخول
        useEffect(() => {
          let active = true;
          async function loadAccount() {
            if (!session?.userId) {
              setUserData(null);
              setFiles([]);
              return;
            }
            const fromIDB = await loadUserStateFromIDB(session.userId);
            const fallbackLS = localStorage.getItem(`studentos_data_${session.userId}`);
            const loaded =
              fromIDB ||
              (fallbackLS ? JSON.parse(fallbackLS) : createInitialUserData(session.userId, session.name));
            if (active) {
              setUserData(loaded);
              setTimerSeconds((loaded.settings?.pomodoroWork || 25) * 60);
              const userFiles = await getScopedFilesIDB(session.userId);
              if (active) setFiles(userFiles);
            }
          }
          loadAccount();
          return () => {
            active = false;
          };
        }, [session]);

        // حفظ تلقائي مستمر لكل تعديل خاص بحساب الطالب فقط
        useEffect(() => {
          if (!session?.userId || !userData) return;
          if (userData.ownerId !== session.userId) return;
          localStorage.setItem(`studentos_data_${session.userId}`, JSON.stringify(userData));
          saveUserStateToIDB(session.userId, userData).catch(() => {});
        }, [userData, session]);

        // تطبيق الوضع الليلي والخطوط
        useEffect(() => {
          const root = document.documentElement;
          if (userData?.settings?.darkMode) {

            root.classList.remove('dark');

          if (userData?.settings?.fontFamily) {

        // مؤقت بومودورو

                notify(`تم تسجيل جلسة مذاكرة (${mins} دقيقة) بنجاح`);
                return mins * 60;
              }
              return prev - 1;

          setAuthError('');
          if (!authForm.name.trim() || !authForm.email.trim() || authForm.password.length < 6) {
            setAuthError('يرجى إدخال الاسم والبريد الإلكتروني وكلمة مرور من 6 أحرف على الأقل.');
            return;
          }
          const normalizedEmail = authForm.email.trim().toLowerCase();
          if (users.some((u) => u.email === normalizedEmail)) {
            setAuthError('هذا البريد الإلكتروني مسجل بالفعل.');
            return;
          }
          const userId = `usr_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
          const salt = Math.random().toString(36).slice(2, 10);
          const passwordHash = await hashPassword(authForm.password, salt);
          const recoveryCode = `SOS-${Math.floor(100000 + Math.random() * 900000)}`;
          const newUser = {
            id: userId,
            name: authForm.name.trim(),
            email: normalizedEmail,
            salt,
            passwordHash,
            recoveryCode,
          };
          setUsers((prev) => [...prev, newUser]);
          const initial = createInitialUserData(userId, newUser.name);
          await saveUserStateToIDB(userId, initial);
          localStorage.setItem(`studentos_data_${userId}`, JSON.stringify(initial));
          const newSession = {
            userId,
            name: newUser.name,
            email: newUser.email,
            token: `tok_${Math.random().toString(36).slice(2)}`,
            createdAt: new Date().toISOString(),
          };
          localStorage.setItem('studentos_session_v1', JSON.stringify(newSession));
          setSession(newSession);
          setAuthInfo(`تم إنشاء الحساب! رمز الاستعادة الخاص بك: ${recoveryCode}`);
        };

        const handleLogin = async (e) => {
          e.preventDefault();
          setAuthError('');
          const normalizedEmail = authForm.email.trim().toLowerCase();
          const user = users.find((u) => u.email === normalizedEmail);
          if (!user) {
            setAuthError('بيانات الدخول غير صحيحة.');
            return;
          }
          const hash = await hashPassword(authForm.password, user.salt);
          if (hash !== user.passwordHash) {
            setAuthError('بيانات الدخول غير صحيحة.');
            return;
          }
          const newSession = {
            userId: user.id,
            name: user.name,
            email: user.email,
            token: `tok_${Math.random().toString(36).slice(2)}`,
            createdAt: new Date().toISOString(),
          };
          localStorage.setItem('studentos_session_v1', JSON.stringify(newSession));
          setSession(newSession);
        };

        const handleResetPassword = async (e) => {
          e.preventDefault();
          setAuthError('');
          const normalizedEmail = authForm.email.trim().toLowerCase();
          const idx = users.findIndex((u) => u.email === normalizedEmail);
          if (idx === -1) {
            setAuthError('لا يوجد حساب مرتبط بهذا البريد الإلكتروني.');
            return;
          }
          if (authForm.password.length < 6) {
            setAuthError('كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل.');
            return;
          }
          const newSalt = Math.random().toString(36).slice(2, 10);
          const newHash = await hashPassword(authForm.password, newSalt);
          const updated = [...users];
          updated[idx] = { ...updated[idx], salt: newSalt, passwordHash: newHash };
          setUsers(updated);
          setAuthInfo('تم تحديث كلمة المرور بأمان. يمكنك تسجيل الدخول الآن.');
          setAuthMode('login');
        };

        const handleLogout = () => {
          setTimerRunning(false);
          localStorage.removeItem('studentos_session_v1');
          setSession(null);
          setUserData(null);
        };

        // =========================================================================
        // 6. حساب الإحصائيات، XP، والمستويات بدون تكرار غير مستحق
        // =========================================================================
        const stats = useMemo(() => {
          if (!userData) return { totalMinutes: 0, completedLessons: 0, totalLessons: 0, completedTasks: 0, xp: 0, level: 1 };
          const totalMinutes = userData.sessions.reduce((acc, s) => acc + (Number(s.minutes) || 0), 0);
          const totalLessons = userData.subjects.reduce((acc, sub) => acc + sub.lessons.length, 0);
          const completedLessons = userData.subjects.reduce(
            (acc, sub) => acc + sub.lessons.filter((l) => l.completed).length,
            0
          );
          const completedTasks = userData.tasks.filter((t) => t.completed).length;
          const xp = totalMinutes * 2 + completedLessons * 30 + completedTasks * 20;
          const level = Math.max(1, Math.floor(xp / 250) + 1);
          return { totalMinutes, completedLessons, totalLessons, completedTasks, xp, level };
        }, [userData]);

        // =========================================================================
        // 7. شاشة تسجيل الدخول / إنشاء الحساب
        // =========================================================================
        if (!session || !userData) {
          return (
            <div className="min-h-screen bg-[#FBF9F5] flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white rounded-3xl border border-slate-200/80 shadow-xl p-6 sm:p-8">
                <div className="flex items-center gap-3 mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-600 text-white flex items-center justify-center font-bold text-xl">
                    🎓
                  </div>
                  <div>
                    <h1 className="text-xl font-extrabold text-slate-900">Student OS</h1>
                    <p className="text-xs text-slate-500">نظام إدارة الدراسة والطلاب — مساحة معزولة وآمنة</p>
                  </div>
                </div>

                <div className="flex gap-2 p-1 bg-slate-100 rounded-xl mb-6 text-sm font-semibold">
                  <button
                    onClick={() => { setAuthMode('login'); setAuthError(''); }}
                    className={`flex-1 py-2 rounded-lg transition ${authMode === 'login' ? 'bg-white shadow text-emerald-700' : 'text-slate-600'}`}
                  >
                    تسجيل الدخول
                  </button>
                  <button
                    onClick={() => { setAuthMode('register'); setAuthError(''); }}
                    className={`flex-1 py-2 rounded-lg transition ${authMode === 'register' ? 'bg-white shadow text-emerald-700' : 'text-slate-600'}`}
                  >
                    حساب جديد
                  </button>
                  <button
                    onClick={() => { setAuthMode('reset'); setAuthError(''); }}
                    className={`flex-1 py-2 rounded-lg transition ${authMode === 'reset' ? 'bg-white shadow text-emerald-700' : 'text-slate-600'}`}
                  >
                    استعادة
                  </button>
                </div>

                {authError && (
                  <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                    {authError}
                  </div>
                )}
                {authInfo && (
                  <div className="mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-medium">
                    {authInfo}
                  </div>
                )}

                <form
                  onSubmit={
                    authMode === 'login'
                      ? handleLogin
                      : authMode === 'register'
                      ? handleRegister
                      : handleResetPassword
                  }
                  className="space-y-4"
                >
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">اسم الطالب</label>
                      <input
                        type="text"
                        required
                        value={authForm.name}
                        onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                        placeholder="مثال: مصطفى ياسر"
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 text-sm"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
                    <input
                      type="email"
                      required
                      value={authForm.email}
                      onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                      placeholder="student@university.edu"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {authMode === 'reset' ? 'كلمة المرور الجديدة' : 'كلمة المرور'}
                    </label>
                    <input
                      type="password"
                      required
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                      placeholder="••••••••"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 text-sm"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm transition shadow-sm"
                  >
                    {authMode === 'login'
                      ? 'دخول إلى مساحتي الدراسية'
                      : authMode === 'register'
                      ? 'إنشاء حساب الطالب'
                      : 'تحديث كلمة المرور'}
                  </button>
                </form>

                {/* بيانات المطور في شاشة الدخول */}
                <div className="mt-6 pt-4 border-t border-slate-200/80 text-center space-y-1">
                  <p className="text-xs font-bold text-slate-700">
                    تطوير وبرمجة: <span className="text-emerald-600">مصطفى ياسر</span>
                  </p>
                  <p className="text-[11px] text-slate-500">
                    للتواصل والعمل:{' '}
                    <a
                      href="tel:015508398551"
                      dir="ltr"
                      className="font-bold text-emerald-700 hover:underline"
                    >
                      015508398551
                    </a>
                  </p>
                </div>
              </div>
            </div>
          );
        }

        // =========================================================================
        // 8. دوال الأنشطة الدراسية والمزامنة والأمان
        // =========================================================================
        const themeAccent =
          userData.settings.themeColor === 'blue'
            ? 'bg-sky-600 hover:bg-sky-700 text-white'
            : userData.settings.themeColor === 'amber'
            ? 'bg-amber-600 hover:bg-amber-700 text-white'
            : 'bg-emerald-600 hover:bg-emerald-700 text-white';

        const fontSizeClass =
          userData.settings.fontSize === 'small'
            ? 'text-sm'
            : userData.settings.fontSize === 'large'
            ? 'text-lg'
            : 'text-base';

        const navItems = [
          { id: 'today', label: 'اليوم', icon: 'home', visible: true },
          { id: 'subjects', label: 'المواد', icon: 'book', visible: userData.settings.visibleTools.subjects },
          { id: 'schedule', label: 'الجدول', icon: 'calendar', visible: userData.settings.visibleTools.schedule },
          { id: 'focus', label: 'التركيز', icon: 'clock', visible: userData.settings.visibleTools.focus },
          { id: 'tasks', label: 'المهام والواجبات', icon: 'check', visible: userData.settings.visibleTools.tasks },
          { id: 'exams', label: 'الامتحانات', icon: 'award', visible: userData.settings.visibleTools.exams },
          { id: 'notes', label: 'الملاحظات', icon: 'note', visible: userData.settings.visibleTools.notes },
          { id: 'files', label: 'الملفات', icon: 'folder', visible: userData.settings.visibleTools.files },
          { id: 'whiteboard', label: 'السبورة', icon: 'pen', visible: userData.settings.visibleTools.whiteboard },
          { id: 'revision', label: 'المراجعة', icon: 'brain', visible: userData.settings.visibleTools.revision },
          { id: 'tutor', label: 'المساعد الذكي', icon: 'sparkles', visible: userData.settings.visibleTools.tutor },
          { id: 'stats', label: 'الإحصائيات', icon: 'chart', visible: userData.settings.visibleTools.stats },
          { id: 'achievements', label: 'الإنجازات', icon: 'trophy', visible: userData.settings.visibleTools.achievements },
          { id: 'notifications', label: 'الإشعارات', icon: 'bell', visible: userData.settings.visibleTools.notifications },
          { id: 'security', label: 'المزامنة والأمان', icon: 'shield', visible: userData.settings.visibleTools.security },
          { id: 'settings', label: 'التخصيص', icon: 'settings', visible: userData.settings.visibleTools.settings },
        ].filter((item) => item.visible);

        const handleTestNotification = async () => {
          if (!('Notification' in window)) {
            notify('المتصفح الحالي لا يدعم إشعارات النظام الخارجية.');
            return;
          }
          const perm = await Notification.requestPermission();
          if (perm === 'granted') {
            new Notification('Student OS — تنبيه دراسي', {
              body: 'تم تفعيل الإشعارات بنجاح لحسابك.',
            });
            setUserData((d) => ({
              ...d,
              notifications: [
                {
                  id: `ntf-${Date.now()}`,
                  ownerId: d.ownerId,
                  category: 'dailyGoals',
                  title: 'إشعار تجريبي فعلي',
                  message: 'تم إرسال الإشعار عبر نظام المتصفح بعد منح الصلاحية.',
                  time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                  read: false,
                },
                ...d.notifications,
              ],
            }));
            notify('تم إرسال الإشعار الفعلي بنجاح.');
          } else {
            notify('لم يتم منح صلاحية الإشعارات — لم يُرسل أي إشعار خارجي.');
          }
        };

        const handleExportBackup = () => {
          const payload = {
            schemaVersion: '1.0',
            exportedAt: new Date().toISOString(),
            ownerId: session.userId,
            data: userData,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `student-os-backup-${session.userId}.json`;
          a.click();
          URL.revokeObjectURL(url);
          notify('تم تنزيل النسخة الاحتياطية بنجاح.');
        };

        const handleImportBackup = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!parsed?.data || !parsed?.ownerId) {
                notify('ملف النسخة الاحتياطية غير صالح.');
                return;
              }
              if (parsed.ownerId !== session.userId) {
                notify('مرفوض أمنياً: هذه النسخة مملوكة لحساب طالب آخر.');
                return;
              }
              setUserData({ ...parsed.data, ownerId: session.userId });
              notify('تم استرجاع بياناتك بنجاح والتحقق من ملكية الحساب.');
            } catch {
              notify('تعذر قراءة ملف النسخة الاحتياطية.');
            }
          };
          reader.readAsText(file);
        };

        const handleCrossAccountAudit = async () => {
          const fakeOtherUser = 'usr_unauthorized_other_student';
          const foreignFiles = await getScopedFilesIDB(fakeOtherUser);
          const foreignState = await loadUserStateFromIDB(fakeOtherUser);
          setPermissionTestResult({
            checkedAt: new Date().toLocaleTimeString('ar-EG'),
            activeOwner: session.userId,
            testedForeignOwner: fakeOtherUser,
            isolated: userData.ownerId === session.userId && foreignFiles.length === 0 && !foreignState,
          });
        };

        const handleAskTutor = async () => {
          if (!aiPrompt.trim()) return;
          const q = aiPrompt.trim();
          setAiPrompt('');
          setAiMessages((prev) => [...prev, { role: 'user', text: q }]);
          setAiLoading(true);
          try {
            const res = await fetch('/api/ai-tutor', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` },
              body: JSON.stringify({ prompt: q }),
            });
            if (res.ok) {
              const json = await res.json();
              setAiMessages((prev) => [...prev, { role: 'assistant', text: json.reply }]);
            } else {
              throw new Error('Offline static host');
            }
          } catch {
            setAiMessages((prev) => [
              ...prev,
              {
                role: 'assistant',
                text: `تم تنظيم سؤالك ("${q}") محلياً: لتشغيل الذكاء الاصطناعي التوليدي المباشر بعد الاستضافة الثابتة على GitHub Pages، اربط نقطة النهاية /api/ai-tutor بخادم وسيط آمن يحفظ مفتاح API على الخادم فقط.`,
              },
            ]);
          } finally {
            setAiLoading(false);
          }
        };

        // =========================================================================
        // 9. الواجهة الرئيسية المتجاوبة (RTL + Mobile First + Dark/Light)
        // =========================================================================
        return (
          <div className={`min-h-screen flex flex-col lg:flex-row bg-[#FBF9F5] dark:bg-slate-950 text-slate-900 dark:text-slate-100 ${fontSizeClass}`}>
            {statusToast && (
              <div className="fixed bottom-4 left-4 z-50 bg-slate-900 text-white dark:bg-emerald-600 px-4 py-2.5 rounded-2xl shadow-lg text-xs font-bold">
                {statusToast}
              </div>
            )}

            {/* الشريط الجانبي */}
            <aside className="lg:w-64 bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-l border-slate-200/80 dark:border-slate-800 p-4 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">{userData.settings.avatar}</span>
                    <div>
                      <div className="font-extrabold text-sm">{userData.studentName}</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        المستوى {stats.level} • {stats.xp} XP
                      </div>
                    </div>
                  </div>
                  <button
                    onClick={() =>
                      setUserData((d) => ({
                        ...d,
                        settings: { ...d.settings, darkMode: !d.settings.darkMode },
                      }))
                    }
                    className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800"
                    title="تبديل الوضع الليلي"
                  >
                    <Icon name={userData.settings.darkMode ? 'sun' : 'moon'} className="w-4 h-4" />
                  </button>
                </div>

                <nav className="flex lg:flex-col gap-1.5 overflow-x-auto pb-2 lg:pb-0">
                  {navItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                        activeTab === item.id
                          ? themeAccent
                          : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                      }`}
                    >
                      <Icon name={item.icon} className="w-4 h-4 shrink-0" />
                      <span>{item.label}</span>
                    </button>
                  ))}
                </nav>
              </div>

              <div className="mt-4 space-y-3">
                {/* بطاقة المطور في الشريط الجانبي */}
                <div className="p-3 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 text-[11px] space-y-1">
                  <div className="font-extrabold text-slate-800 dark:text-slate-200">المطور: مصطفى ياسر</div>
                  <div className="text-slate-500 dark:text-slate-400">
                    رقم العمل:{' '}
                    <a href="tel:015508398551" dir="ltr" className="font-bold text-emerald-600 dark:text-emerald-400 hover:underline">
                      015508398551
                    </a>
                  </div>
                </div>

                <button
                  onClick={handleLogout}
                  className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl border border-rose-200 dark:border-rose-900/50 text-rose-600 text-xs font-bold hover:bg-rose-50 dark:hover:bg-rose-950/30"
                >
                  <Icon name="logout" className="w-4 h-4" />
                  <span>تسجيل الخروج</span>
                </button>
              </div>
            </aside>

            {/* المحتوى الرئيسي */}
            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-6xl mx-auto w-full space-y-6">
              {/* 1. اليوم (Today) */}
              {activeTab === 'today' && (
                <div className="space-y-6">
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800">
                    <h2 className="text-xl font-extrabold mb-1">مرحباً، {userData.studentName}</h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400">
                      هدف المذاكرة اليومي: {userData.settings.dailyGoalMinutes} دقيقة • أوقات الدراسة: {userData.settings.studyHoursStart} - {userData.settings.studyHoursEnd}
                    </p>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">
                      <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                        <div className="text-xs text-slate-500">دقائق المذاكرة</div>
                        <div className="text-2xl font-extrabold mt-1">{stats.totalMinutes}</div>
                      </div>
                      <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                        <div className="text-xs text-slate-500">الدروس المكتملة</div>
                        <div className="text-2xl font-extrabold mt-1">
                          {stats.completedLessons}/{stats.totalLessons}
                        </div>
                      </div>
                      <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                        <div className="text-xs text-slate-500">المهام المنجزة</div>
                        <div className="text-2xl font-extrabold mt-1">{stats.completedTasks}</div>
                      </div>
                      <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                        <div className="text-xs text-slate-500">المستوى والنقاط</div>
                        <div className="text-2xl font-extrabold mt-1">Lv.{stats.level} ({stats.xp})</div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800">
                    <h3 className="font-bold text-sm mb-3">اختصارات سريعة</h3>
                    <div className="flex flex-wrap gap-2">
                      {userData.settings.shortcuts.map((sc) => (
                        <button
                          key={sc}
                          onClick={() => setActiveTab(sc)}
                          className={`px-4 py-2 rounded-xl text-xs font-bold ${themeAccent}`}
                        >
                          الانتقال إلى {navItems.find((n) => n.id === sc)?.label || sc}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 2. المواد والدروس */}
              {activeTab === 'subjects' && (
                <div className="space-y-6">
                  <div className="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800">
                    <h2 className="font-extrabold text-base mb-4">إضافة مادة دراسية</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                      <input
                        placeholder="اسم المادة"
                        value={newSubject.name}
                        onChange={(e) => setNewSubject({ ...newSubject, name: e.target.value })}
                        className="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-xs"

                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {userData.flashcards.map((fc) => (
                      <div
                        key={fc.id}
                        onClick={() => setFlippedCardId(flippedCardId === fc.id ? null : fc.id)}
                        className="p-5 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60 cursor-pointer border border-slate-200/60 dark:border-slate-700"
                      >
                        <div className="text-[10px] text-slate-400 mb-1">
                          {flippedCardId === fc.id ? 'الإجابة (اضغط للعودة)' : 'السؤال (اضغط لقلب البطاقة)'}
                        </div>
                        <div className="font-bold text-xs">
                          {flippedCardId === fc.id ? fc.back : fc.front}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 11. المساعد التعليمي الذكي */}
              {activeTab === 'tutor' && (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-4">
                  <h2 className="font-extrabold text-base">المساعد التعليمي الذكي</h2>
                  <div className="space-y-2 max-h-72 overflow-y-auto p-3 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                    {aiMessages.map((m, idx) => (
                      <div
                        key={idx}
                        className={`p-3 rounded-2xl text-xs ${
                          m.role === 'user'
                            ? 'bg-emerald-600 text-white mr-8'
                            : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 ml-8'
                        }`}
                      >
                        {m.text}
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <input
                      value={aiPrompt}
                      onChange={(e) => setAiPrompt(e.target.value)}
                      placeholder="اسأل عن مفهوم دراسي أو اطلب تلخيصاً..."
                      className="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-xs"
                    />
                    <button
                      disabled={aiLoading}
                      onClick={handleAskTutor}
                      className={`px-4 py-2 rounded-xl text-xs font-bold ${themeAccent}`}
                    >
                      {aiLoading ? 'جارٍ المعالجة...' : 'إرسال'}
                    </button>
                  </div>
                </div>
              )}

              {/* 12. الإحصائيات */}
              {activeTab === 'stats' && (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-4">
                  <h2 className="font-extrabold text-base">تحليلات وإحصائيات المذاكرة</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                      <div className="text-xs text-slate-500">إجمالي جلسات التركيز</div>
                      <div className="text-2xl font-extrabold mt-1">{userData.sessions.length} جلسة</div>
                    </div>
                    <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                      <div className="text-xs text-slate-500">إجمالي وقت الدراسة</div>
                      <div className="text-2xl font-extrabold mt-1">{stats.totalMinutes} دقيقة</div>
                    </div>
                    <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                      <div className="text-xs text-slate-500">نسبة إنجاز الدروس</div>
                      <div className="text-2xl font-extrabold mt-1">
                        {stats.totalLessons ? Math.round((stats.completedLessons / stats.totalLessons) * 100) : 0}%
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 13. الإنجازات والتحفيز الصحي */}
              {activeTab === 'achievements' && (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-extrabold text-base">نظام الإنجازات والتحفيز الصحي</h2>
                    <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">
                      المستوى {stats.level} • {stats.xp} XP
                    </span>
                  </div>
                  <p className="text-xs text-slate-500">
                    تُحتسب النقاط تلقائياً من الجلسات والدروس والمهام الفعلية فقط دون تكرار، مع احترام أيام الراحة وتجنب الإرهاق.
                  </p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                      <div className="font-bold">🏅 أول جلسة مذاكرة</div>
                      <div className="text-slate-500 mt-1">
                        {userData.sessions.length >= 1 ? 'مكتمل ومستحق' : 'قيد التقدم'}
                      </div>
                    </div>
                    <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60">
                      <div className="font-bold">🔥 5 جلسات تركيز</div>
                      <div className="text-slate-500 mt-1">
                        {userData.sessions.length >= 5 ? 'مكتمل ومستحق' : `${userData.sessions.length} / 5 جلسات`}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 14. الإشعارات */}
              {activeTab === 'notifications' && (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h2 className="font-extrabold text-base">نظام الإشعارات والتنبيهات</h2>
                    <button
                      onClick={handleTestNotification}
                      className={`px-4 py-2 rounded-xl text-xs font-bold ${themeAccent}`}
                    >
                      طلب الصلاحية واختبار إشعار فعلي
                    </button>
                  </div>
                  <div className="space-y-2">
                    {userData.notifications.map((n) => (
                      <div key={n.id} className="flex items-center justify-between p-3 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60 text-xs">
                        <div>
                          <div className="font-bold">{n.title}</div>
                          <div className="text-slate-500">{n.message}</div>
                        </div>
                        <button
                          onClick={() =>
                            setUserData((d) => ({
                              ...d,
                              notifications: d.notifications.filter((item) => item.id !== n.id),
                            }))
                          }
                          className="text-rose-500"
                        >
                          حذف
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 15. المزامنة والأمان */}
              {activeTab === 'security' && (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-5">
                  <h2 className="font-extrabold text-base">المزامنة، النسخ الاحتياطي، وعزل الصلاحيات</h2>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={handleExportBackup} className={`px-4 py-2 rounded-xl text-xs font-bold ${themeAccent}`}>
                      تصدير نسخة احتياطية (JSON)
                    </button>
                    <label className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold cursor-pointer">
                      استرجاع من نسخة احتياطية
                      <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                    </label>
                    <button
                      onClick={handleCrossAccountAudit}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold"
                    >
                      اختبار صلاحيات وعزل حسابين
                    </button>
                  </div>

                  {permissionTestResult && (
                    <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 text-xs space-y-1">
                      <div className="font-bold text-emerald-800 dark:text-emerald-300">
                        نتيجة فحص العزل ({permissionTestResult.checkedAt}): {permissionTestResult.isolated ? 'ناجح 100% — معزول تماماً' : 'فشل'}
                      </div>
                      <div>المالك النشط: {permissionTestResult.activeOwner}</div>
                      <div>تم حظر الوصول لبيانات وملفات الحساب الآخر: {permissionTestResult.testedForeignOwner}</div>
                    </div>
                  )}
                </div>
              )}

              {/* 16. التخصيص الشخصي */}
              {activeTab === 'settings' && (
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-5">
                  <div className="flex items-center justify-between">
                    <h2 className="font-extrabold text-base">التخصيص الشخصي لحسابك</h2>
                    <button
                      onClick={() => {
                        setUserData((d) => ({ ...d, settings: { ...DEFAULT_SETTINGS } }));
                        notify('تمت استعادة الإعدادات الافتراضية');
                      }}
                      className="px-3 py-1.5 rounded-xl border border-rose-300 text-rose-600 text-xs font-bold"
                    >
                      استعادة الإعدادات الافتراضية
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div>
                      <label className="block font-bold mb-1">لون الواجهة</label>
                      <select
                        value={userData.settings.themeColor}
                        onChange={(e) =>
                          setUserData((d) => ({ ...d, settings: { ...d.settings, themeColor: e.target.value } }))
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent"
                      >
                        <option value="emerald">زمردي هادئ</option>
                        <option value="blue">أزرق أكاديمي</option>
                        <option value="amber">كهرماني دافئ</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">نوع الخط العربي</label>
                      <select
                        value={userData.settings.fontFamily}
                        onChange={(e) =>
                          setUserData((d) => ({ ...d, settings: { ...d.settings, fontFamily: e.target.value } }))
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent"
                      >
                        <option value="Cairo">Cairo</option>
                        <option value="Tajawal">Tajawal</option>
                        <option value="IBM Plex Sans Arabic">IBM Plex Sans Arabic</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">حجم الخط</label>
                      <select
                        value={userData.settings.fontSize}
                        onChange={(e) =>
                          setUserData((d) => ({ ...d, settings: { ...d.settings, fontSize: e.target.value } }))
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent"
                      >
                        <option value="small">صغير</option>
                        <option value="medium">متوسط</option>
                        <option value="large">كبير</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold mb-1">مدة جلسة بومودورو (دقيقة)</label>
                      <input
                        type="number"
                        min="5"
                        max="120"
                        value={userData.settings.pomodoroWork}
                        onChange={(e) =>
                          setUserData((d) => ({
                            ...d,
                            settings: { ...d.settings, pomodoroWork: Number(e.target.value) || 25 },
                          }))
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent"
                      />
                    </div>

                    <div>
                      <label className="block font-bold mb-1">هدف المذاكرة اليومي (دقيقة)</label>
                      <input
                        type="number"
                        min="15"
                        max="600"
                        value={userData.settings.dailyGoalMinutes}
                        onChange={(e) =>
                          setUserData((d) => ({
                            ...d,
                            settings: { ...d.settings, dailyGoalMinutes: Number(e.target.value) || 120 },
                          }))
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent"
                      />
                    </div>

                    <div>
                      <label className="block font-bold mb-1">أيقونة الحساب</label>
                      <select
                        value={userData.settings.avatar}
                        onChange={(e) =>
                          setUserData((d) => ({ ...d, settings: { ...d.settings, avatar: e.target.value } }))
                        }
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent"
                      >
                        <option value="🎓">🎓 طالب جامعي</option>
                        <option value="📚">📚 باحث ومجتهد</option>
                        <option value="🧠">🧠 مفكر ومحلل</option>
                        <option value="🚀">🚀 منجز</option>
                      </select>
                    </div>
                  </div>

                  {/* بطاقة عن مطور النظام */}
                  <div className="p-4 rounded-2xl bg-[#FBF9F5] dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700 text-xs space-y-1.5">
                    <div className="font-extrabold text-slate-800 dark:text-slate-100">عن مطور النظام</div>
                    <div className="text-slate-600 dark:text-slate-300">
                      المطور: <span className="font-bold">مصطفى ياسر</span>
                    </div>
                    <div className="text-slate-600 dark:text-slate-300">
                      رقم التواصل للعمل:{' '}
                      <a
                        href="tel:015508398551"
                        dir="ltr"
                        className="font-bold text-emerald-600 dark:text-emerald-400 hover:underline"
                      >
                        015508398551
                      </a>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<StudentOS />);
    </script>
  </body>
  </html>
